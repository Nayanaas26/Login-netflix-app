<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix | Content Hub</title>
    <link rel="stylesheet" href="style.css?v=1.3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="navbar" id="navbar">
        <div class="logo">
            <svg width="120" height="32" viewBox="0 0 111 30" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M105.062 14.28L111 30c-1.75-.25-3.499-.563-5.28-.845l-3.345-8.686-3.437 7.969c-1.687-.281-3.344-.375-5.062-.531l6.093-13.875L104.187 0h5.312l-4.437 14.28zM90.47 0h-5.313V30h5.313V0zm-9.577 0h-5.312l-1.47 11.593L72.639 0h-5.312V30h5.312V11.594L74.135 30h5.312l1.44-11.594L82.323 30h5.312V0zM5.218 0H0v30a88.804 88.804 0 0 1 5.218-.874V0zm17.206 0h-5.219v20.396l-8.72 1.396V0H3.259v30a88.86 88.86 0 0 1 19.165-2.205V0zm23.48 0h-4.747v25.214a88.81 88.81 0 0 1 19.626-1.928V23.27c-5.712 0-10.73.922-14.878 1.944V0zM47.982 0h-5.313V30h5.313V0zm39.205 0h-5.312V30h5.312V0zM27.973 0h-5.312v30h5.312V0zm-6.905 0h-5.313v30h5.313V0z"
                    fill="#E50914" />
            </svg>
        </div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">TV Shows</a>
            <a href="#">Movies</a>
            <a href="#">Latest</a>
            <a href="#">My List</a>
        </div>
        <div class="user-actions">
            <span id="user-name">Loading...</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </header>

    <main>
        <div class="hero" id="hero-banner">
            <div class="hero-content">
                <h1 id="hero-title">Loading...</h1>
                <p id="hero-desc"></p>
                <div class="hero-buttons">
                    <button class="play-btn">Play</button>
                    <button class="more-info-btn">More Info</button>
                </div>
            </div>
        </div>

        <div id="movie-rows">
            <!-- Rows will be injected here by script.js -->
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Netflix Clone Hub by Antigravity</p>
    </footer>

    <script src="script.js?v=1.1"></script>
</body>

</html>
